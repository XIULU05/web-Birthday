<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Vayholine!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="f1-navbar">
        <div class="logo">
            <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/F1.svg/1200px-F1.svg.png" alt="F1 Logo" class="f1-logo"></a>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#drivers">Drivers</a></li>
            <li><a href="#teams">Teams</a></li>
            <li><a href="#message">My F1</a></li>
        </ul>
        <div class="nav-icons">
            <div class="music-container">
                <button id="music-btn" class="nav-button"><i class="fas fa-music"></i></button>
                <ul id="playlist-menu" class="playlist-menu hidden">
                    <li>
                        <button class="song-item" data-src="Just-Keep-Watching.mp3">
                            <img src="tate.png" alt="Just Keep Watching">
                            <span>Just Keep Watching</span>
                        </button>
                    </li>
                    <li>
                        <button class="song-item" data-src="Lose My Mind.mp3">
                            <img src="lose.png" alt="Lose My Mind">
                            <span>Lose My Mind</span>
                        </button>
                    </li>
                    <li>
                        <button class="song-item" data-src="Friday Song.mp3">
                            <img src="friday.png" alt="Friday Song">
                            <span>Friday Song</span>
                        </button>
                    </li>
                </ul>
                <audio id="background-music" src="" loop></audio>
            </div>
        </div>
    </nav>

    <section id="home" class="hero-section">
        <header class="main-header">
            <h1 class="fade-in-up">¡FELIZ CUMPLEAÑOS, VAYHOLINE!</h1>
            <p class="fade-in-up delay-1">La campeona de mi vida.</p>
        </header>
    </section>

    <main class="f1-content">
        <section id="drivers" class="gallery-section">
            <h2>Pilotos Favoritos</h2>
            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="ia-verstappen.png" alt="Vayholine con Verstappen">
                    <div class="card-overlay">
                        <p class="pit-board">Happy Birthday Champion!</p>
                    </div>
                </div>
                <div class="gallery-card">
                    <img src="ia-leclerc.png" alt="Vayholine con Leclerc">
                    <div class="card-overlay">
                        <p class="pit-board">Te quiero más que a un Ferrari.</p>
                    </div>
                </div>
                <div class="gallery-card">
                    <img src="ia-hamilton.jpg" alt="Vayholine con Hamilton">
                    <div class="card-overlay">
                        <p class="pit-board">¡Eres la GOAT de mi vida!</p>
                    </div>
                </div>
                <div class="gallery-card">
                    <img src="ia-russell.jpg" alt="Vayholine con Russell">
                    <div class="card-overlay">
                        <p class="pit-board">Aceleras mi corazón.</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="teams" class="section-placeholder">
             <h2>Próximamente: Equipos Favoritos...</h2>
        </section>


        <section id="message" class="personal-message-section">
            <p id="message-text"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
